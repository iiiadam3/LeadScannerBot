name: Daily Reddit Lead Scanner

on:
  schedule:
    # שעון השרתים של גיטהאב הוא ב-UTC.
    # השעה 05:00 ב-UTC שווה ל-08:00 בבוקר שעון ישראל (שעון קיץ)
    - cron: '0 5 * * *'
  workflow_dispatch: # זה כפתור קסם שמאפשר לך להריץ את הקוד ידנית מתי שתרצה לבדיקה

jobs:
  run-scanner:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Reddit Scanner
      env:
        # כאן השרת שואב את הסיסמה מהכספת של גיטהאב ומעביר אותה לקוד פייתון
        GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      run: python r3ddit.py